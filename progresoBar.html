<h3>🚀 Nivel de dominio</h3>

<svg width="100%" height="40">
  <rect width="100%" height="10" rx="5" ry="5" fill="#e0e0e0"/>
  <rect width="90%" height="10" rx="5" ry="5" fill="#0078ff">
    <animate attributeName="width" from="0" to="90%" dur="1.5s" fill="freeze" />
  </rect>
  <text x="5" y="30" fill="#333" font-size="14">HTML5 — 90%</text>
</svg>

<svg width="100%" height="40">
  <rect width="100%" height="10" rx="5" ry="5" fill="#e0e0e0"/>
  <rect width="80%" height="10" rx="5" ry="5" fill="#f7df1e">
    <animate attributeName="width" from="0" to="80%" dur="1.5s" fill="freeze" />
  </rect>
  <text x="5" y="30" fill="#333" font-size="14">JavaScript — 80%</text>
</svg>
